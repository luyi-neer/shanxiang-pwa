name: Fetch Realtime Weather Data
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch realtime data
        run: node scripts/fetch-realtime.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add realtime/
          git diff --staged --quiet || git commit -m "chore: update realtime weather data [skip ci]"
          git push
