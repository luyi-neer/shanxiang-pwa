<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2d5016">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>山象 · 山岳天气</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>
  <nav id="tab-bar">
    <a href="#/" class="tab-item active" data-route="/">
      <span class="tab-icon">⛰️</span><span>山峰</span>
    </a>
    <a href="#/alerts" class="tab-item" data-route="/alerts">
      <span class="tab-icon">⚠️</span><span>预警</span>
    </a>
    <a href="#/mine" class="tab-item" data-route="/mine">
      <span class="tab-icon">👤</span><span>我的</span>
    </a>  </nav>
  <script src="js/peaks.js"></script>
  <script src="js/astro.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
        reg.update();
      });
    }
    if (window.Capacitor) {
      document.documentElement.style.setProperty('--safe-top', '32px');
    }
  </script>
  <a href="javascript:void(0)" onclick="(function(){if(window.Capacitor||navigator.userAgent.includes('wv')){location.href='https://localhost/'}else{history.back()}})()" style="position:fixed;bottom:calc(60px + env(safe-area-inset-bottom,0px));right:16px;width:40px;height:40px;background:#2d5016;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:18px;z-index:200;box-shadow:0 4px 14px rgba(45,80,22,0.4);" title="切换应用">⚡</a>
</body>
</html>
